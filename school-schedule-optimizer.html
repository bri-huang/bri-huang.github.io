        function copyChangeLog() {
            const formattedLogText = state.changeLog.map(entry => `[${entry.timestamp}] ${entry.actionType}: ${entry.details}`).join('\n');
            
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = formattedLogText;
            tempTextArea.style.position = 'fixed'; 
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            const copyBtn = document.getElementById('copy-log-btn');
            if (copyBtn) {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
                copyBtn.classList.add('bg-emerald-600');
                copyBtn.classList.remove('bg-slate-800');
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.classList.remove('bg-emerald-600');
                    copyBtn.classList.add('bg-slate-800');
                }, 1500);
            }
        }

        function clearChangeLog() {
            state.changeLog = [];
            logAction("Log Cleared", "Cleared history trail database log.");
            render();
        }

        function render() {
            const root = document.getElementById('app-root');
            if (!state.dataLoaded) {
                root.innerHTML = getEmptyStateHTML();
            } else {
                root.innerHTML = `
                    ${getHeaderHTML()}
                    ${getViewsHTML()}
                `;
            }
        }

        function getEmptyStateHTML() {
            return `
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                            <svg class="text-blue-600 w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            Science Dept. Schedule Analyzer
                        </h1>
                    </div>
                </div>
                ${state.errorMsg ? `<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg font-medium">${state.errorMsg}</div>` : ''}
                <div class="bg-white p-12 rounded-xl shadow-sm border border-slate-200 text-center flex flex-col items-center justify-center flex-1 min-h-[400px]">
                    <div class="bg-blue-50 p-5 rounded-full text-blue-500 mb-4">
                        <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Upload your schedule to begin</h2>
                    <p class="text-slate-500 max-w-md mb-6">Select the Science Dept CSV file (e.g., <strong>Science + CTE Schedule - copy - CS_PLTW (5).csv</strong>). The analyzer dynamically adjusts row layouts to fit your viewport screen.</p>
                    <label class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg cursor-pointer transition-colors shadow-sm font-medium flex items-center gap-2">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload CSV Schedule
                        <input type="file" accept=".csv" class="hidden file-upload-input" />
                    </label>
                    <label class="mt-3 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-6 py-2.5 rounded-lg cursor-pointer transition-colors shadow-sm font-medium flex items-center gap-2">
                        Open Saved Project
                        <input type="file" accept=".json,.schedule.json,application/json" class="hidden project-upload-input" />
                    </label>
                </div>
            `;
        }

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('file-upload-input')) {
                handleUpload(e);
            }
            if (e.target.classList.contains('project-upload-input')) {
                handleProjectUpload(e);
            }
            if (e.target.classList.contains('room-selector')) {
                const classId = parseInt(e.target.dataset.id);
                const newRoom = e.target.value;
                const cls = state.proposed.find(c => c.id === classId);
                if (cls) {
                    const originalRoom = cls.Room || "TBD";
                    cls.Room = newRoom;
                    logAction("Room Change", `Changed ${cls.Teacher}'s ${cls.Course} (Period ${cls.Period}) room allocation from ${originalRoom} to ${newRoom || "TBD"}.`);
                    updateConflicts(state.proposed);
                    updateMetrics();
                    generateSuggestions(); 
                    render(); 
                }
            }
        });

        document.addEventListener('click', (e) => {
            const fixBtn = e.target.closest('.apply-fix-btn');
            if (fixBtn) {
                const idx = parseInt(fixBtn.dataset.idx);
                const classId = parseInt(fixBtn.dataset.classid);
                const customPeriod = document.getElementById(`edit-act-period-${idx}`).value;
                const customRoom = document.getElementById(`edit-act-room-${idx}`).value;

                const cls = state.proposed.find(c => c.id === classId);
                if (cls) {
                    const oldPeriod = cls.Period;
                    const oldRoom = cls.Room || "TBD";
                    cls.Period = customPeriod;
                    cls.Room = customRoom;
                    logAction("Manual Adjustment", `Manually reassigned ${cls.Teacher}'s ${cls.Course} from Period ${oldPeriod} (Room ${oldRoom}) to Period ${customPeriod} (Room ${customRoom || 'TBD'}).`);
                }
                
                updateConflicts(state.proposed);
                updateMetrics();
                generateSuggestions(); 
                render();
                return;
            }

            const viewBtn = e.target.closest('.view-btn');
            if (viewBtn) {
                setView(viewBtn.dataset.view);
                return;
            }

            const listTabBtn = e.target.closest('.list-tab-btn');
            if (listTabBtn) {
                setListTab(listTabBtn.dataset.listTab);
                return;
            }

            const sortHeader = e.target.closest('.sort-header');
            if (sortHeader) {
                handleSort(sortHeader.dataset.sort);
                return;
            }

            const teacherBtn = e.target.closest('.teacher-sel-btn');
            if (teacherBtn) {
                selectTeacherForPrefs(teacherBtn.dataset.teacher);
                return;
            }

            const saveBtn = e.target.closest('#save-prefs-btn');
            if (saveBtn) {
                savePreferences();
                return;
            }

            const superOptBtn = e.target.closest('#super-optimize-btn');
            if (superOptBtn) {
                state.useSuperOptimizer = !state.useSuperOptimizer;
                logAction("Optimizer Config", `Transition optimizer super-optimization rule marked as ${state.useSuperOptimizer ? "Enabled" : "Disabled"}.`);
                generateSuggestions();
                render();
                return;
            }

            const randomOptBtn = e.target.closest('#random-optimize-btn');
            if (randomOptBtn) {
                runRandomOptimizer();
                return;
            }

            const resetBtn = e.target.closest('#reset-schedule-btn');
            if (resetBtn) {
                state.useSuperOptimizer = false;
                state.proposed = JSON.parse(JSON.stringify(state.flattened)); 
                updateConflicts(state.proposed);
                state.suggestions = [];
                state.view = 'teacher';
                logAction("Schedule Reverted", "Discarded current proposal layout; schedule reset back to baseline uploaded CSV settings.");
                updateMetrics();
                generateSuggestions();
                render();
                return;
            }
        });

        document.addEventListener('dragstart', (e) => {
            if(e.target.tagName.toLowerCase() === 'select') {
                e.preventDefault();
                return;
            }
            const draggie = e.target.closest('.draggable-class');
            if (draggie) {
                state.draggedClassId = parseInt(draggie.dataset.id);
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData('text/plain', draggie.dataset.id);
            }
        });

        document.addEventListener('dragover', (e) => {
            const dropzone = e.target.closest('.dropzone-td');
            if (dropzone) {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                dropzone.classList.add('drag-over');
            }
        });

        document.addEventListener('dragleave', (e) => {
            const dropzone = e.target.closest('.dropzone-td');
            if (dropzone) {
                dropzone.classList.remove('drag-over');
            }
        });

        document.addEventListener('drop', (e) => {
            const dropzone = e.target.closest('.dropzone-td');
            if (dropzone) {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                if (!state.draggedClassId) return;

                const targetGrid = dropzone.dataset.grid;
                const targetPeriod = dropzone.dataset.period;
                const cls = state.proposed.find(c => c.id === state.draggedClassId);
                
                if (cls) {
                    const originalPeriod = cls.Period;
                    if (targetGrid === 'teacher') {
                        const originalTeacher = cls.Teacher;
                        cls.Period = targetPeriod;
                        cls.Teacher = dropzone.dataset.teacher;
                        logAction("Class Moved", `Dragged ${cls.Course} from ${originalTeacher} (Period ${originalPeriod}) to ${cls.Teacher} (Period ${cls.Period}).`);
                    } else if (targetGrid === 'room') {
                        const originalRoom = cls.Room || "TBD";
                        cls.Period = targetPeriod;
                        cls.Room = dropzone.dataset.room;
                        logAction("Class Moved", `Dragged ${cls.Teacher}'s ${cls.Course} from Period ${originalPeriod} (Room ${originalRoom}) to Period ${cls.Period} (Room ${cls.Room}).`);
                    }
                    updateConflicts(state.proposed);
                    updateMetrics();
                    generateSuggestions(); 
                    render();
                }
                state.draggedClassId = null;
            }
        });

        restoreCourseTeamData();
        window.onload = render;
    </script>
</body>
</html>
